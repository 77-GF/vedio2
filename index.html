<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP4 视频上传</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f0f0f;
    color: #e0e0e0;
  }
  .container {
    width: 100%;
    max-width: 540px;
    padding: 32px 24px;
  }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 28px;
    letter-spacing: 0.02em;
  }

  /* 上传区域 */
  .upload-zone {
    border: 2px dashed #3a3a3a;
    border-radius: 12px;
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    background: #1a1a1a;
    position: relative;
  }
  .upload-zone:hover,
  .upload-zone.drag-over { border-color: #6c5ce7; background: #1e1c2e; }
  .upload-zone.has-file { border-color: #00b894; border-style: solid; }

  .upload-icon {
    width: 48px; height: 48px;
    margin: 0 auto 16px;
    color: #888;
  }
  .upload-icon svg { width: 100%; height: 100%; }

  .upload-zone h2 {
    font-size: 1rem;
    font-weight: 500;
    margin-bottom: 6px;
    color: #ccc;
  }
  .upload-zone p {
    font-size: 0.8rem;
    color: #777;
  }
  .upload-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  /* 进度条 */
  .progress-wrap {
    margin-top: 20px;
    display: none;
  }
  .progress-wrap.visible { display: block; }
  .progress-bar {
    height: 4px;
    border-radius: 2px;
    background: #333;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #6c5ce7, #a29bfe);
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 0.75rem;
    color: #888;
  }

  /* 预览卡片 */
  .preview-card {
    margin-top: 20px;
    display: none;
  }
  .preview-card.visible { display: block; }

  .preview-inner {
    background: #1a1a1a;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #2a2a2a;
  }
  .preview-inner video {
    width: 100%;
    display: block;
    background: #000;
  }
  .preview-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .file-info {
    flex: 1;
    min-width: 0;
  }
  .file-name {
    font-size: 0.85rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #ddd;
  }
  .file-size {
    font-size: 0.75rem;
    color: #777;
    margin-top: 2px;
  }
  .btn-row { display: flex; gap: 8px; }

  .btn {
    padding: 8px 18px;
    border: none;
    border-radius: 8px;
    font-size: 0.8rem;
    cursor: pointer;
    font-weight: 500;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn-remove { background: #2d2d2d; color: #e0e0e0; }
  .btn-remove:hover { background: #3d3d3d; }
  .btn-upload { background: #6c5ce7; color: #fff; }
  .btn-upload:hover { opacity: 0.9; }
  .btn-upload:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #2d2d2d;
    color: #e0e0e0;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 0.82rem;
    opacity: 0;
    transition: transform 0.3s, opacity 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.error { border-left: 3px solid #e17055; }
  .toast.success { border-left: 3px solid #00b894; }
</style>
</head>
<body>

<div class="container">
  <h1>MP4 视频上传</h1>

  <div class="upload-zone" id="uploadZone">
    <div class="upload-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </div>
    <h2>点击或拖拽上传</h2>
    <p>仅支持 .mp4 格式，文件大小不超过 500MB</p>
    <input type="file" id="fileInput" accept="video/mp4,.mp4">
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="progress-info">
      <span id="progressLabel">上传中...</span>
      <span id="progressPercent">0%</span>
    </div>
  </div>

  <div class="preview-card" id="previewCard">
    <div class="preview-inner">
      <video id="videoPreview" controls preload="metadata"></video>
      <div class="preview-meta">
        <div class="file-info">
          <div class="file-name" id="fileName"></div>
          <div class="file-size" id="fileSize"></div>
        </div>
        <div class="btn-row">
          <button class="btn btn-remove" id="btnRemove">移除</button>
          <button class="btn btn-upload" id="btnUpload">上传</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const uploadZone = document.getElementById('uploadZone');
  const fileInput = document.getElementById('fileInput');
  const previewCard = document.getElementById('previewCard');
  const videoPreview = document.getElementById('videoPreview');
  const fileName = document.getElementById('fileName');
  const fileSize = document.getElementById('fileSize');
  const btnRemove = document.getElementById('btnRemove');
  const btnUpload = document.getElementById('btnUpload');
  const progressWrap = document.getElementById('progressWrap');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const progressPercent = document.getElementById('progressPercent');
  const toast = document.getElementById('toast');

  const MAX_SIZE = 500 * 1024 * 1024; // 500MB
  let selectedFile = null;
  let toastTimer = null;

  function showToast(msg, type) {
    if (toastTimer) clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className = 'toast ' + type + ' show';
    toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2500);
  }

  function formatBytes(bytes) {
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  }

  function handleFile(file) {
    if (!file) return;

    if (!file.name.toLowerCase().endsWith('.mp4') && file.type !== 'video/mp4') {
      showToast('仅支持 MP4 格式的视频文件', 'error');
      return;
    }
    if (file.size > MAX_SIZE) {
      showToast('文件大小不能超过 500MB', 'error');
      return;
    }

    selectedFile = file;
    fileName.textContent = file.name;
    fileSize.textContent = formatBytes(file.size);

    const url = URL.createObjectURL(file);
    videoPreview.src = url;

    previewCard.classList.add('visible');
    uploadZone.classList.add('has-file');
    progressWrap.classList.remove('visible');
  }

  function removeFile() {
    selectedFile = null;
    videoPreview.src = '';
    URL.revokeObjectURL(videoPreview.src);
    previewCard.classList.remove('visible');
    uploadZone.classList.remove('has-file');
    progressWrap.classList.remove('visible');
    fileInput.value = '';
  }

  function simulateUpload() {
    if (!selectedFile) return;
    btnUpload.disabled = true;
    progressWrap.classList.add('visible');
    let pct = 0;
    const interval = setInterval(() => {
      pct += Math.random() * 15;
      if (pct >= 100) {
        pct = 100;
        clearInterval(interval);
        progressFill.style.width = '100%';
        progressPercent.textContent = '100%';
        progressLabel.textContent = '上传完成';
        btnUpload.disabled = false;
        showToast('上传成功！', 'success');
        return;
      }
      progressFill.style.width = pct + '%';
      progressPercent.textContent = Math.round(pct) + '%';
    }, 200);
  }

  // 点击上传区域
  uploadZone.addEventListener('click', () => fileInput.click());

  // 文件选择
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) handleFile(e.target.files[0]);
  });

  // 拖拽
  uploadZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadZone.classList.add('drag-over');
  });
  uploadZone.addEventListener('dragleave', () => {
    uploadZone.classList.remove('drag-over');
  });
  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });

  // 粘贴
  document.addEventListener('paste', (e) => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.kind === 'file' && item.type.startsWith('video/')) {
        handleFile(item.getAsFile());
        break;
      }
    }
  });

  btnRemove.addEventListener('click', removeFile);
  btnUpload.addEventListener('click', simulateUpload);
</script>

</body>
</html>
